{% extends "base.html" %}
{% block title %}Laptop Management Portal - Login{% endblock %}
{% block content %}
<div class="login-page">
  <div class="login-card">

    <div style="text-align: center; margin-bottom: 24px;">
      <div style="width: 64px; height: 64px; margin: 0 auto 16px; background: rgba(59, 130, 246, 0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
        <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="var(--accent-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="2" y1="20" x2="22" y2="20"></line>
        </svg>
      </div>
      <h2 style="font-size: 1.6rem; font-weight: 700; color: var(--text-primary);">College Laptop Gate System</h2>
      <p style="font-size: 0.88rem; color: var(--text-secondary); margin-top: 6px;">Sign in to access your dashboard (Admin / Security)</p>
    </div>

    <!-- Single Unified Login Form -->
    <form method="POST" action="/login" id="loginForm" style="text-align: left;" onsubmit="handleLoginSubmit(event)">
      <div class="form-group">
        <label class="form-label" for="usernameInput">Username</label>
        <input type="text" id="usernameInput" name="username" class="form-control" required autocomplete="username" placeholder="Enter username (e.g. admin or security)" style="height: 44px; font-size: 0.95rem;">
      </div>
      
      <div class="form-group" style="margin-top: 16px;">
        <label class="form-label" for="passwordInput">Password</label>
        <div style="position: relative;">
          <input type="password" id="passwordInput" name="password" class="form-control" required autocomplete="current-password" placeholder="Enter password" style="height: 44px; font-size: 0.95rem; padding-right: 40px;">
          <button type="button" onclick="togglePasswordVisibility()" aria-label="Toggle Password Visibility" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 4px;">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-block" style="margin-top: 24px; height: 46px; font-weight: 600; font-size: 1rem;">
        Sign In
      </button>
    </form>

    <div style="margin-top: 20px; text-align: center; font-size: 0.8rem; color: var(--text-secondary);">
      Authorized Personnel Only &bull; Laptop Gate Tracking
    </div>

  </div>
</div>

<script>
function togglePasswordVisibility() {
  const pwdInput = document.getElementById('passwordInput');
  const eyeIcon = document.getElementById('eyeIcon');
  if (pwdInput.type === 'password') {
    pwdInput.type = 'text';
    eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
  } else {
    pwdInput.type = 'password';
    eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
  }
}

function handleLoginSubmit(e) {
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading-spinner" style="width:16px;height:16px;border-width:2px;display:inline-block;vertical-align:middle;margin-right:8px;"></span> Authenticating...';
}

window.addEventListener('pageshow', function(event) {
  const btn = document.getElementById('submitBtn');
  if (btn) {
    btn.disabled = false;
    btn.innerHTML = 'Sign In';
  }
});
</script>
{% endblock %}
