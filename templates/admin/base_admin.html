{% extends "base.html" %}
{% block content %}
<div class="page-wrapper">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <i class="bi bi-laptop fs-4 text-primary me-2"></i>
      <h2 style="font-size: 1.15rem; margin: 0; font-weight: 700;">CPAT Laptop Gate</h2>
    </div>
    <nav class="sidebar-nav">
      <a href="/admin/dashboard" class="nav-link {% if 'dashboard' in request.path or request.path == '/admin/' %}active{% endif %}">
        <i class="bi bi-speedometer2 me-2"></i> Dashboard
      </a>
      <a href="/admin/students" class="nav-link {% if 'students' in request.path and 'add' not in request.path %}active{% endif %}">
        <i class="bi bi-people-fill me-2"></i> Students
      </a>
      <a href="/admin/students/add" class="nav-link {% if 'add' in request.path %}active{% endif %}">
        <i class="bi bi-person-plus-fill me-2"></i> Register Student
      </a>
      <a href="/admin/records" class="nav-link {% if 'records' in request.path %}active{% endif %}">
        <i class="bi bi-journal-text me-2"></i> Gate Records
      </a>
      <a href="/admin/logs" class="nav-link {% if 'logs' in request.path %}active{% endif %}">
        <i class="bi bi-clock-history me-2"></i> System Logs
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="/logout" class="nav-link logout-link">
        <i class="bi bi-box-arrow-right me-2"></i> Logout
      </a>
    </div>

  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <div class="topbar">
      <button class="hamburger" onclick="toggleSidebar()" id="hamburgerBtn" aria-label="Toggle Navigation Menu">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
      <div class="user-info" style="display: flex; align-items: center; gap: 15px;">
        <span class="current-date-badge" id="currentDateDisplay" style="font-size: 0.85rem; color: var(--text-secondary);"></span>
        <span class="user-badge">Admin</span>
        <a href="/logout" class="btn btn-outline btn-sm desktop-logout" style="padding: 4px 10px;">Logout</a>
      </div>
    </div>
    <div class="content-area">
      {% block page_content %}{% endblock %}
    </div>
  </main>
</div>

<!-- Mobile sidebar overlay -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<script>
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('active');
  document.getElementById('sidebarOverlay').classList.toggle('active');
}

document.addEventListener('DOMContentLoaded', function() {
  const dateEl = document.getElementById('currentDateDisplay');
  if (dateEl) {
    const now = new Date();
    dateEl.textContent = now.toLocaleDateString('en-IN', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  }
});
</script>
{% endblock %}
